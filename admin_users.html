<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers | Gayatri Electronics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --secondary: #64748b; --dark: #0f172a; --light: #f8fafc;
            --white: #ffffff; --border: #e2e8f0; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background-color: var(--light); color: var(--dark); display: flex; min-height: 100vh; }

        /* SIDEBAR (Consistent with Dashboard) */
        .sidebar {
            width: 280px; background: var(--dark); color: var(--white); padding: 30px;
            display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100;
        }
        .sidebar h2 { font-size: 24px; color: var(--primary); margin: 0; font-weight: 800; }
        .sidebar p.owner { font-size: 12px; color: #94a3b8; margin-bottom: 40px; text-transform: uppercase; }
        .nav-link {
            display: block; padding: 12px 15px; color: #cbd5e1; text-decoration: none;
            border-radius: 12px; margin-bottom: 8px; font-weight: 500;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: var(--white); }
        .nav-link.active { background: var(--primary); color: var(--white); }

        /* MAIN CONTENT */
        .main-content { margin-left: 280px; flex: 1; padding: 40px; }
        .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        
        /* TABS & SEARCH */
        .tabs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .tabs-container {
            display: inline-flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
        }
        .tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            background: transparent;
            color: var(--secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: var(--dark);
        }
        .tab-btn.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 12px;
            background: #f1f5f9;
            color: var(--secondary);
        }
        .tab-btn.active .tab-count {
            background: #dbeafe;
            color: var(--primary);
        }

        .search-container {
            position: relative;
            min-width: 300px;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: var(--white);
            color: var(--dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        /* ROLE BADGES */
        .badge-role {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            vertical-align: middle;
            margin-left: 8px;
            line-height: 1.4;
        }
        .badge-customer {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }
        .badge-admin {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        /* TABLE STYLING */
        .card {
            background: var(--white); border-radius: 24px; border: 1px solid var(--border);
            box-shadow: var(--shadow); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f1f5f9; padding: 15px 20px; font-size: 12px; text-transform: uppercase; color: var(--secondary); font-weight: 700; }
        td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        
        .user-name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .user-name { font-weight: 700; color: var(--dark); }
        .user-email { font-size: 12px; color: var(--secondary); margin-top: 2px; display: block; }
        
        .btn-view {
            padding: 8px 16px; background: var(--light); border: 1px solid var(--border);
            border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-view:hover { background: var(--primary); color: white; border-color: var(--primary); }

        @media (max-width: 1024px) {
            .sidebar { width: 80px; padding: 15px; }
            .sidebar h2, .sidebar p, .nav-link span { display: none; }
            .main-content { margin-left: 80px; }
        }
        @media (max-width: 768px) {
            .tabs-header { flex-direction: column; align-items: stretch; }
            .search-container { min-width: 100%; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>GAYATRI</h2>
        <p class="owner">Admin: Baldevsinh</p>
        <nav class="nav-menu">
            <a href="admin_dashboard.html" class="nav-link"><span>Dashboard Summary</span></a>
            <a href="admin_users.html" class="nav-link active"><span>Manage Customers</span></a>
            <a href="admin_loans.html" class="nav-link"><span>Loan Management</span></a>
            <a href="admin_ledger.html" class="nav-link"><span>Global Ledger</span></a>
        </nav>
        <div style="margin-top: auto; font-size: 11px; color: #64748b;">
            Gayatri Electronics<br>Jamnagar, Gujarat
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <div>
                <h1>Manage Accounts</h1>
                <p style="color: var(--secondary); margin-top: 5px;">View and manage registered customers and system administrators.</p>
            </div>
        </div>

        <div class="tabs-header">
            <div class="tabs-container" role="tablist">
                <button type="button" class="tab-btn active" id="tabCustomersBtn" onclick="switchTab('customers')" role="tab" aria-selected="true">
                    Customers <span class="tab-count" id="customerCount">0</span>
                </button>
                <button type="button" class="tab-btn" id="tabAdminsBtn" onclick="switchTab('admins')" role="tab" aria-selected="false">
                    Admins <span class="tab-count" id="adminCount">0</span>
                </button>
            </div>

            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, email, phone, or UID..." oninput="handleSearch()">
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th id="detailsColHeader">Customer Details</th>
                        <th>Phone Number</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: var(--secondary);">
                            Loading accounts...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/admin-users.js"></script>
</body>
</html>
