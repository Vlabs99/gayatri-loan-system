<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer History | Gayatri Electronics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --bg: #f8fafc; --border: #e2e8f0; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 25px; height: 100vh; position: fixed; }
        .main-content { margin-left: 260px; flex-grow: 1; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 30px; }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .info-box label { display: block; font-size: 12px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .info-box div { font-size: 20px; font-weight: 700; margin-top: 5px; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-right: 10px; width: 200px; }
        button { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; background: #f1f5f9; color: #64748b; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2 style="color: var(--primary);">GAYATRI</h2>
        <ul style="list-style: none; padding: 0;">
            <li style="padding: 10px 0;"><a href="admin_dashboard.html" style="color: white; text-decoration: none;">← Back to Dashboard</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="card">
            <div class="info-grid">
                <div class="info-box"><label>Customer Name</label><div id="custName">Loading...</div></div>
                <div class="info-box"><label>Product</label><div id="productName">Loading...</div></div>
                <div class="info-box"><label>Remaining Balance</label><div id="remainingAmt" style="color: #ef4444;">₹0</div></div>
            </div>
        </div>

        <div class="card">
            <h3>Add Payment</h3>
            <input type="number" id="payAmount" placeholder="Amount (₹)">
            <input type="text" id="payNote" placeholder="Payment Note">
            <button onclick="window.addPayment()">Record Payment</button>
        </div>

        <div class="card">
            <h3>Payment History (Detailed)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Note</th>
                        <th style="text-align: right;">Amount Paid</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <tr><td colspan="3" style="text-align:center; padding:20px;">Fetching records...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/admin-user-details.js"></script>
</body>
</html>
