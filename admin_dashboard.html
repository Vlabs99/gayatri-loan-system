<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Gayatri Electronics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --dark: #0f172a; --light: #f1f5f9; --white: #ffffff;
            --border: #e2e8f0; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; display: flex; background: #f8fafc; color: var(--dark); min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 25px; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .sidebar h2 { color: var(--primary); font-size: 20px; margin-bottom: 30px; }
        .nav-links { list-style: none; padding: 0; flex-grow: 1; }
        .nav-links li { padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .nav-links li:hover, .nav-links li.active { background: rgba(37, 99, 235, 0.2); color: var(--primary); font-weight: 600; }
        .nav-links a { color: inherit; text-decoration: none; display: block; }
        .logout-btn { color: #f87171; cursor: pointer; padding: 15px; font-weight: 600; font-size: 14px; }

        /* Main Content */
        .main-content { margin-left: 260px; flex-grow: 1; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .stat-card label { font-size: 12px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .stat-card h3 { font-size: 28px; margin: 10px 0 0 0; font-weight: 800; }

        /* Recent Activity Table */
        .recent-activity { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .recent-activity h4 { margin: 0 0 20px 0; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--light); color: #64748b; font-size: 13px; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--light); font-size: 14px; }
        .amt-pos { color: #16a34a; font-weight: 700; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>GAYATRI <span style="font-size: 12px; color: #94a3b8; display: block;">ELECTRONICS</span></h2>
        <ul class="nav-links">
            <li class="active"><a href="admin_dashboard.html">Dashboard</a></li>
            <li><a href="admin_users.html">Customers</a></li>
            <li><a href="admin_loans.html">New Loan</a></li>
            <li><a href="admin_ledger.html">Full Ledger</a></li>
            <li><a href="admin_register.html">Register User</a></li>
        </ul>
        <div class="logout-btn" id="logoutBtn">Logout</div>
    </nav>

    <main class="main-content">
        <div class="header">
            <h1>Business Overview</h1>
            <div style="font-size: 14px; color: #64748b;">Welcome, <strong>Baldevsinh</strong></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><label>Total Outgoing (Principal)</label><h3 id="totalPrincipal">₹0</h3></div>
            <div class="stat-card"><label>Expected (With Interest)</label><h3 id="totalExpected">₹0</h3></div>
            <div class="stat-card" style="border-left: 5px solid #16a34a;"><label>Total Collected</label><h3 id="totalCollected" style="color: #16a34a;">₹0</h3></div>
            <div class="stat-card" style="border-left: 5px solid #ef4444;"><label>Pending Balance</label><h3 id="totalPending" style="color: #ef4444;">₹0</h3></div>
        </div>

        <div class="recent-activity">
            <h4>Recent Payments</h4>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Note</th>
                        <th style="text-align: right;">Amount</th>
                    </tr>
                </thead>
                <tbody id="recentLedgerBody">
                    <tr><td colspan="4" style="text-align:center; padding:20px;">Loading latest activity...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/admin-dashboard.js"></script>
</body>
</html>
