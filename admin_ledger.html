<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Ledger | Gayatri Electronics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --bg: #f8fafc; --border: #e2e8f0; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 25px; height: 100vh; position: fixed; }
        .sidebar h2 { color: var(--primary); font-size: 20px; margin-bottom: 30px; }
        .nav-links { list-style: none; padding: 0; }
        .nav-links li { padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .nav-links a { color: #94a3b8; text-decoration: none; display: block; }
        .nav-links li.active { background: rgba(37, 99, 235, 0.2); }
        .nav-links li.active a { color: white; font-weight: 600; }

        /* Content */
        .main-content { margin-left: 260px; flex-grow: 1; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: #f1f5f9; color: #64748b; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
        .amt { font-weight: 700; color: #16a34a; text-align: right; }
        .timestamp { font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>GAYATRI</h2>
        <ul class="nav-links">
            <li><a href="admin_dashboard.html">Dashboard</a></li>
            <li><a href="admin_users.html">Customers</a></li>
            <li class="active"><a href="admin_ledger.html">Transaction History</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="card">
            <h2 style="margin-top:0;">Master Payment History</h2>
            <p style="color: #64748b; font-size: 14px;">Every payment collected across all loans.</p>
            
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Customer Name</th>
                        <th>Note</th>
                        <th style="text-align: right;">Amount</th>
                    </tr>
                </thead>
                <tbody id="globalLedgerBody">
                    <tr><td colspan="4" style="text-align:center; padding:40px;">Loading History...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/admin-global-ledger.js"></script>
</body>
</html>
